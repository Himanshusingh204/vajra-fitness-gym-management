<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="kIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="kIconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="kGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#kIconBg)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" stroke="#1E293B" stroke-width="2"/>

  <!-- Centered Korrum Monogram -->
  <g transform="translate(126, 126)">
    <!-- Base Pillar -->
    <rect x="30" y="26" width="46" height="208" rx="14" fill="url(#kIconBlue)" filter="url(#kGlow)"/>
    <!-- Upper Angle -->
    <path d="M 100 120 L 180 30 L 230 30 L 140 130 Z" fill="url(#kIconBlue)"/>
    <!-- Lower Angle -->
    <path d="M 140 120 L 230 230 L 180 230 L 100 130 Z" fill="#22C55E"/>
    <!-- Central Power Joint -->
    <rect x="74" y="98" width="48" height="48" rx="12" fill="#020617" stroke="#60A5FA" stroke-width="8"/>
  </g>
</svg>
