<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="kavachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#9D0208" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2421" />
      <stop offset="100%" stop-color="#0F1110" />
    </linearGradient>
  </defs>

  <!-- Icon Mark: Geometric Shield + Power Core -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield Contour -->
    <path d="M 40 4 L 72 16 L 72 48 C 72 68 56 82 40 88 C 24 82 8 68 8 48 L 8 16 Z" 
          fill="url(#shieldGrad)" stroke="url(#kavachGrad)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Dynamic Power V Chevron -->
    <path d="M 40 24 L 56 36 L 40 68 L 24 36 Z" 
          fill="url(#kavachGrad)" />
    <!-- Core Diamond Accent -->
    <polygon points="40,38 46,46 40,54 34,46" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="110" y="58" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" font-size="38" letter-spacing="-0.5" fill="#111827">
    KAVACH
  </text>
  <text x="270" y="58" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="400" font-size="38" letter-spacing="-0.5" fill="#E63946">
    FIT
  </text>
  <text x="112" y="78" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" font-size="11" letter-spacing="4" fill="#6B7280">
    GYM OPERATING SYSTEM
  </text>
</svg>
