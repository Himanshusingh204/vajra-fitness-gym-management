version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vajra_admin
      POSTGRES_PASSWORD: vajra_secure_pass
      POSTGRES_DB: vajra_fitness
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vajra_admin -d vajra_fitness"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass vajra_redis_pass

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://vajra_admin:vajra_secure_pass@db:5432/vajra_fitness?schema=public
      REDIS_URL: redis://:vajra_redis_pass@redis:6379
      JWT_SECRET: replace_this_with_a_secure_64_char_random_string
      FRONTEND_URL: https://app.vajrafitness.in
      TRUST_PROXY: '1'
      # Uncomment and set once you have an SMTP provider (activation/reset emails):
      # SMTP_HOST: smtp.example.com
      # SMTP_PORT: '587'
      # SMTP_USER: ''
      # SMTP_PASS: ''
      # SMTP_FROM: 'Vajra Fitness <no-reply@vajrafitness.in>'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  pgdata:
