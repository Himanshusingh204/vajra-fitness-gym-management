name: vajrafitness

# Full local stack. Every value has a local-only default, so
# `docker compose up --build` works as is; copy docker.env.example to .env
# to change ports or credentials. Web: http://localhost:8080, mail inbox:
# http://localhost:8025. Demo data: `docker compose run --rm seed`.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vajra_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vajra_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-vajra_fitness}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 5433 on the host so it does not clash with a Postgres already on 5432.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  migrate:
    build:
      context: ./backend
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vajra_admin}:${POSTGRES_PASSWORD:-vajra_secure_pass}@db:5432/${POSTGRES_DB:-vajra_fitness}?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${API_NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vajra_admin}:${POSTGRES_PASSWORD:-vajra_secure_pass}@db:5432/${POSTGRES_DB:-vajra_fitness}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local_only_jwt_secret_change_me_0123456789abcdef}
      FRONTEND_URL: http://localhost:${WEB_PORT:-8080}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      TRUST_PROXY: "1"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: ${SMTP_FROM:-Vajra Fitness <no-reply@localhost>}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # One-shot demo data load. Not started by `up`; runs from the build stage,
  # which still has tsx and the seed scripts.
  seed:
    profiles: ["seed"]
    build:
      context: ./backend
      target: build
    command: ["npm", "run", "seed"]
    restart: "no"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-vajra_admin}:${POSTGRES_PASSWORD:-vajra_secure_pass}@db:5432/${POSTGRES_DB:-vajra_fitness}?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
