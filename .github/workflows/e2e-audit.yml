name: E2E and audits

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-audit:
    name: Playwright, SEO, accessibility and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vajra_admin
          POSTGRES_PASSWORD: vajra_secure_pass
          POSTGRES_DB: vajra_fitness_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vajra_admin -d vajra_fitness_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # NODE_ENV=test keeps rate limiting off and stops the API from sending mail,
    # and the seed scripts only refuse to run when it is "production".
    env:
      DATABASE_URL: postgresql://vajra_admin:vajra_secure_pass@localhost:5432/vajra_fitness_e2e?schema=public
      NODE_ENV: test
      JWT_SECRET: e2e_jwt_secret_for_ci_pipeline_at_least_32_chars
      PORT: 5000
      FRONTEND_URL: http://localhost:4173
      CORS_ORIGINS: http://localhost:4173
      BASE_URL: http://localhost:4173
      API_URL: http://localhost:5000/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Same quirk as the quality job in deploy.yml: nested lockfiles crash
      # npm's workspace resolution, so they are removed before the install.
      - name: Install dependencies (workspace root)
        run: |
          rm -f backend/package-lock.json frontend/package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed demo data
        working-directory: backend
        run: npm run seed

      - name: Start API
        working-directory: backend
        run: |
          node dist/server.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:5000/api/health > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Start frontend preview
        working-directory: frontend
        run: |
          npx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          exit 1

      - name: Install Playwright browsers
        id: ready
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # The four scripts below are added to frontend/package.json separately.
      # --if-present makes each one a no-op until it exists. Each step runs even
      # when an earlier one failed, so one report shows every problem.
      - name: Playwright end-to-end tests
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        run: npm run test:e2e --workspace=frontend --if-present

      - name: SEO audit
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        run: npm run audit:seo --workspace=frontend --if-present

      - name: Accessibility audit
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        run: npm run audit:a11y --workspace=frontend --if-present

      - name: Lighthouse
        if: ${{ !cancelled() && steps.ready.conclusion == 'success' }}
        run: npm run lighthouse --workspace=frontend --if-present

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload screenshots and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            frontend/test-results/
            frontend/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: frontend/lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload server logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/preview.log
          if-no-files-found: ignore
          retention-days: 7
