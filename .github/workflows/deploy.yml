name: Vajra Fitness CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type Check, Lint, Build & Tests
    runs-on: ubuntu-latest

    services:
      # Backend tests run against a dedicated test database. Credentials match
      # backend/tests/global-setup.ts defaults; the schema is pushed at test time.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vajra_admin
          POSTGRES_PASSWORD: vajra_secure_pass
          POSTGRES_DB: vajra_fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vajra_admin -d vajra_fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://vajra_admin:vajra_secure_pass@localhost:5432/vajra_fitness_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend TypeScript
        working-directory: backend
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

# Deployment itself is handled by Vercel's native GitHub integration (see
# vercel.json + DEPLOYMENT.md) — it deploys automatically on every push to
# main once the repo is imported on vercel.com. This workflow is just the
# quality gate (types, lint, tests, build) that must pass first.
