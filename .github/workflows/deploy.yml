name: Vajra Fitness CI/CD

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Type Check, Lint, Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Backend tests run against a dedicated test database. Credentials match
      # backend/tests/global-setup.ts defaults; the schema is pushed at test time.
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vajra_admin
          POSTGRES_PASSWORD: vajra_secure_pass
          POSTGRES_DB: vajra_fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vajra_admin -d vajra_fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vajra_admin:vajra_secure_pass@localhost:5432/vajra_fitness_test?schema=public
      TEST_DATABASE_URL: postgresql://vajra_admin:vajra_secure_pass@localhost:5432/vajra_fitness_test?schema=public
      NODE_ENV: test
      JWT_SECRET: test_jwt_secret_for_ci_pipeline_at_least_32_chars

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Remove nested package-locks before workspace install so npm Arborist
      # builds a single consistent workspace dependency graph without edgesOut crashes.
      - name: Install dependencies (workspace root)
        run: |
          rm -f backend/package-lock.json frontend/package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Validate backend TypeScript
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

# Deployment itself is handled by Vercel's native GitHub integration (see
# vercel.json + DEPLOYMENT.md). Vercel deploys main to production and builds a
# preview for every other branch, including staging. This workflow is just the
# quality gate (types, lint, tests, build).
