name: Database Backup

on:
  schedule:
    # 02:00 UTC daily.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    name: Dump production database
    runs-on: ubuntu-latest
    # Only runs if PROD_DATABASE_URL is configured (repo secret) — see
    # DEPLOYMENT.md "Backups" section for setup instructions. Skips cleanly
    # instead of failing every night on repos that haven't set it up yet.
    if: ${{ vars.BACKUPS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run backup
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          AWS_S3_BACKUP_BUCKET: ${{ vars.AWS_S3_BACKUP_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh

      # GitHub Actions artifacts on a PUBLIC repo are downloadable by any
      # authenticated GitHub user — read access to the repo is all it takes,
      # no collaborator/write access required. A raw production DB dump
      # (member PII, payment records) must never be uploaded here in
      # plaintext. Only upload once scripts/backup.sh has encrypted it (which
      # it does only when BACKUP_ENCRYPTION_KEY is set, and deletes the
      # plaintext dump immediately after) — this step deliberately only
      # globs *.gpg so an unencrypted dump can never be picked up by mistake.
      - name: Upload encrypted backup as workflow artifact
        if: ${{ secrets.BACKUP_ENCRYPTION_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backend/backups/*.sql.gz.gpg
          retention-days: 30
