    <!-- Same logic as applyTheme in src/store/useThemeStore.ts, run before first paint. -->
    <script>
      (function () {
        var choice = 'system';
        try {
          var saved = JSON.parse(localStorage.getItem('vf-theme') || '{}');
          var t = saved.state && saved.state.theme;
          if (t === 'dark' || (saved.version === 1 && t === 'light')) choice = t;
        } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) root.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#141416' : '#f4f4f2');
      })();
    </script>
